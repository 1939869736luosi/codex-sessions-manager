name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tracked compatibility fixtures
        run: npm run compat:check

      - name: Type-check
        run: npm run typecheck

      - name: Verify Windows path containment invariants
        if: runner.os == 'Windows'
        run: >-
          npx vitest run
          tests/path-safety.test.ts
          tests/windows-destructive-policy.test.ts
          tests/compat-v063.test.ts
          --testTimeout=30000

      - name: Run tests
        if: runner.os != 'Windows'
        run: npm test

      - name: Enforce coverage threshold
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Smoke CLI and read-only MCP process entrypoints
        run: npm run smoke:release

      - name: Check npm package contents
        run: npm run pack:check

  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm audit is intentionally network-backed. It is not treated as an
      # offline or deterministic substitute for the cross-platform test suite.
      - name: Audit production dependencies
        run: npm run audit:prod
