name: Codex compatibility watch

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Report official stable version drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Validate the tracked offline baseline
        run: node scripts/check-compat.mjs

      - name: Check the official stable release without changing the repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-upstream-version.mjs "${RUNNER_TEMP}/codex-compat-watch.json"

      - name: Upload the public-safe report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-compat-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-compat-watch.json
          if-no-files-found: error
          retention-days: 30
